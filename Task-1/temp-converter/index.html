<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="converter-card">

            <!-- Heading -->
            <div class="header">

                <div class="temperature-icon">
                    🌡️
                </div>

                <h1>Temperature Converter</h1>

                <p>
                    Convert temperatures between Celsius,
                    Fahrenheit, and Kelvin.
                </p>

            </div>


            <!-- Temperature Input -->
            <div class="input-group">

                <label for="temperature">
                    Temperature
                </label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter temperature"
                    step="any"
                >

                <p id="error-message" class="error-message"></p>

            </div>


            <!-- Unit Selection -->
            <div class="input-group">

                <label for="unit">
                    Input Unit
                </label>

                <select id="unit">

                    <option value="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                    <option value="kelvin">
                        Kelvin (K)
                    </option>

                </select>

            </div>


            <!-- Convert Button -->
            <button id="convert-btn" class="convert-btn">
                Convert Temperature
            </button>


            <!-- Results -->
            <div id="results" class="results">

                <h2>Conversion Results</h2>


                <div class="result-item">

                    <span>
                        Celsius
                    </span>

                    <strong id="celsius-result">
                        --
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        Fahrenheit
                    </span>

                    <strong id="fahrenheit-result">
                        --
                    </strong>

                </div>


                <div class="result-item">

                    <span>
                        Kelvin
                    </span>

                    <strong id="kelvin-result">
                        --
                    </strong>

                </div>

            </div>


            <!-- Information -->
            <div class="info">

                <p>
                    💡 Tip: Absolute zero is
                    -273.15°C, -459.67°F, or 0 K.
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
